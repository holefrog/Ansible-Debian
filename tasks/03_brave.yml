---
# tasks/03_brave.yml — Brave Browser 安装

- name: "3.1 | 下载 Brave GPG 签名密钥"
  raw: >
    curl -fsSLo {{ brave_keyring }}
    https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg

- name: "3.2 | 添加 Brave APT 源"
  raw: >
    echo "deb [signed-by={{ brave_keyring }} arch=amd64]
    https://brave-browser-apt-release.s3.brave.com/ stable main"
    > {{ brave_sources }}

- name: "3.3 | apt-get update（含 Brave 源）"
  raw: "apt-get update -qq"

- name: "3.4 | 安装 brave-browser"
  raw: "apt-get install -y -qq brave-browser"
