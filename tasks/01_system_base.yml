---
# tasks/01_system_base.yml — 系统基础配置

- name: "1.1 | 设置时区"
  raw: "timedatectl set-timezone {{ timezone }}"

- name: "1.2 | 启用 en_US.UTF-8 locale"
  raw: |
    sed -i 's/^# *en_US.UTF-8 UTF-8/en_US.UTF-8 UTF-8/' /etc/locale.gen
    locale-gen
    update-locale LANG=en_US.UTF-8

- name: "1.3 | apt-get update"
  raw: "apt-get update -qq"

- name: "1.4 | 安装基础依赖包"
  raw: >
    apt-get install -y -qq
    curl ca-certificates gnupg sudo
    nftables network-manager wpasupplicant cage

- name: "1.5 | 配置 GRUB 开机不等待"
  lineinfile:
    path: /etc/default/grub
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    create: no
  loop:
    - regexp: "^GRUB_TIMEOUT_STYLE="
      line: "GRUB_TIMEOUT_STYLE=hidden"
    - regexp: "^GRUB_TIMEOUT="
      line: "GRUB_TIMEOUT=0"
    - regexp: "^GRUB_RECORDFAIL_TIMEOUT="
      line: "GRUB_RECORDFAIL_TIMEOUT=0"
  register: grub_boot_timeout

- name: "1.6 | 更新 GRUB 配置"
  command: update-grub
  when: grub_boot_timeout is changed

- name: "1.7 | 设置主机名"
  hostname:
    name: "{{ hostname }}"
