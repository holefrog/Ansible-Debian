---
# tasks/02_network.yml — NetworkManager 网络与 Wi-Fi 配置

- name: "2.0 | 设置 Wi-Fi 配置文件路径"
  set_fact:
    wifi_connection_file: /etc/NetworkManager/system-connections/wifi.nmconnection

- name: "2.1 | 查找所有已存在的 Wi-Fi 配置文件"
  find:
    paths: /etc/NetworkManager/system-connections/
    patterns: "*.nmconnection"
    contains: "type=wifi"
  register: old_wifi_configs

- name: "2.2 | 清除原来其它的 Wi-Fi 配置文件"
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ old_wifi_configs.files | rejectattr('path', 'equalto', wifi_connection_file) | list }}"
  register: removed_old_wifi_configs

- name: "2.3 | 传递 Wi-Fi 配置 J2 模板文件"
  template:
    src: templates/wifi.nmconnection.j2
    dest: "{{ wifi_connection_file }}"
    owner: root
    group: root
    mode: "0600"
  register: deployed_wifi_config

- name: "2.4 | 创建 NetworkManager conf.d 目录"
  file:
    path: /etc/NetworkManager/conf.d
    state: directory

- name: "2.5 | 上传 NM 自动重连配置"
  copy:
    src: files/networkmanager/99-autoconnect.conf
    dest: /etc/NetworkManager/conf.d/99-autoconnect.conf
    owner: root
    group: root
    mode: "0644"
  register: deployed_nm_autoconnect_config

- name: "2.6 | 启用 NetworkManager 服务"
  systemd:
    name: NetworkManager
    enabled: yes
    state: started
    daemon_reload: yes

- name: "2.7 | 重载 NetworkManager 连接配置"
  command: nmcli connection reload
  when: >
    removed_old_wifi_configs is changed or
    deployed_wifi_config is changed or
    deployed_nm_autoconnect_config is changed

- name: "2.8 | 尝试激活新的 Wi-Fi 连接"
  command: "nmcli con up '{{ wifi_ssid }}'"
  when: deployed_wifi_config is changed
  ignore_errors: yes
