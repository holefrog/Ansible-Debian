---
# tasks/02_network.yml — NetworkManager 网络与 Wi-Fi 配置

- name: "2.1 | 查找所有已存在的 Wi-Fi 配置文件"
  find:
    paths: /etc/NetworkManager/system-connections/
    patterns: "*.nmconnection"
    contains: "type=wifi"
  register: old_wifi_configs

- name: "2.2 | 清除原来所有的 Wi-Fi 配置文件"
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ old_wifi_configs.files }}"

- name: "2.3 | 传递 Wi-Fi 配置 J2 模板文件"
  template:
    src: templates/wifi.nmconnection.j2
    dest: "/etc/NetworkManager/system-connections/{{ wifi_ssid }}.nmconnection"
    owner: root
    group: root
    mode: "0600"

- name: "2.4 | 创建 NetworkManager conf.d 目录"
  file:
    path: /etc/NetworkManager/conf.d
    state: directory

- name: "2.5 | 上传 NM 自动重连配置"
  copy:
    src: files/networkmanager/99-autoconnect.conf
    dest: /etc/NetworkManager/conf.d/99-autoconnect.conf
    owner: root
    group: root
    mode: "0644"

- name: "2.6 | 启用并重启 NetworkManager 服务"
  systemd:
    name: NetworkManager
    enabled: yes
    state: restarted
    daemon_reload: yes

- name: "2.7 | 尝试激活新的 Wi-Fi 连接"
  command: "nmcli con up '{{ wifi_ssid }}'"
  ignore_errors: yes
