---
# tasks/08_maintenance.yml — 维护工具

- name: "8.1 | 上传 Brave 更新后检查脚本"
  copy:
    src: post_update_check.sh
    dest: "/home/{{ kiosk_user }}/post_update_check.sh"
    owner: "{{ kiosk_user }}"
    group: "{{ kiosk_user }}"
    mode: "0755"

- name: "8.2 | 部署完成后自动重启"
  reboot:
    msg: "Ansible 部署完成，系统自动重启"
    reboot_timeout: 600
    connect_timeout: 10
    post_reboot_delay: 10
